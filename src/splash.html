<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VideoVault Loading</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, Roboto, Arial, sans-serif;
      background: #fff7ed;
      color: #0f172a;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top left, rgba(245,127,23,0.18), transparent 28%),
                  radial-gradient(circle at bottom right, rgba(229,57,53,0.14), transparent 32%),
                  linear-gradient(180deg, #fff7ed 0%, #fff1e0 100%);
    }
    .card {
      width: min(92vw, 460px);
      padding: 34px;
      border-radius: 28px;
      background: rgba(255,255,255,0.96);
      box-shadow: 0 26px 90px rgba(15,23,42,0.10);
      border: 1px solid rgba(251,146,60,0.18);
      text-align: center;
    }
    .logo {
      width: 90px;
      height: 90px;
      margin: 0 auto 18px;
      border-radius: 24px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #e53935 0%, #f57f17 100%);
      box-shadow: 0 16px 38px rgba(229,57,53,0.18);
    }
    .logo img {
      width: 52px;
      height: 52px;
    }
    h1 {
      margin: 0;
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: #0f172a;
    }
    p {
      margin: 16px auto 28px;
      max-width: 34rem;
      line-height: 1.75;
      color: #475569;
    }
    .loader {
      position: relative;
      width: 78px;
      height: 78px;
      margin: 0 auto;
      border-radius: 50%;
      background: rgba(229,57,53,0.08);
      display: grid;
      place-items: center;
    }
    .spinner {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 6px solid rgba(245,127,23,0.26);
      border-top-color: #e53935;
      animation: spin 1.1s linear infinite;
    }
    .loader::after {
      content: "";
      position: absolute;
      inset: 12px;
      border-radius: 50%;
      background: rgba(255,255,255,0.92);
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .note {
      margin-top: 26px;
      color: #334155;
      font-size: 0.95rem;
      line-height: 1.65;
    }
    .small-meta {
      margin-top: 20px;
      color: #6b7280;
      font-size: 0.9rem;
      letter-spacing: 0.01em;
    }
  </style>
</head>
<body>
  <section class="card">
    <div class="logo">
      <img src="../icons/app-icon.svg" alt="VideoVault logo">
    </div>
    <h1>Starting VideoVault</h1>
    <p>Getting your downloader ready. The app will open automatically once the backend and UI are fully initialized.</p>
    <div class="loader"><span class="spinner"></span></div>
    <div class="note">Using your native Electron shell with a Quarkus backend and Angular frontend.</div>
    <div class="small-meta">VideoVault • loading resources…</div>
  </section>
</body>
</html>
